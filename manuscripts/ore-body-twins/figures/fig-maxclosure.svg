<svg xmlns="http://www.w3.org/2000/svg" width="730" height="350" viewBox="0 0 730 350" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="oa" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1a1a2e"/>
    </marker>
    <marker id="op" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#888"/>
    </marker>
  </defs>

  <text x="182" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a2e">block model + slope precedence</text>
  <text x="545" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a2e">Picard max-closure = min s-t cut</text>

  <!-- LEFT: a small block model, benches; top level surface, precedence upward -->
  <!-- surface (top) level: 4 blocks -->
  <g font-size="12">
    <rect x="40" y="70" width="52" height="46" fill="#eef3f8" stroke="#1b6ca8" stroke-width="1.3"/>
    <text x="66" y="98" text-anchor="middle" fill="#1b6ca8">-1</text>
    <rect x="92" y="70" width="52" height="46" fill="#e5f0e6" stroke="#3fa34d" stroke-width="1.3"/>
    <text x="118" y="98" text-anchor="middle" fill="#2f7d3a">+3</text>
    <rect x="144" y="70" width="52" height="46" fill="#e5f0e6" stroke="#3fa34d" stroke-width="1.3"/>
    <text x="170" y="98" text-anchor="middle" fill="#2f7d3a">+4</text>
    <rect x="196" y="70" width="52" height="46" fill="#eef3f8" stroke="#1b6ca8" stroke-width="1.3"/>
    <text x="222" y="98" text-anchor="middle" fill="#1b6ca8">-2</text>
  </g>
  <!-- deeper level: 2 blocks (offset, need the 3 above by slope) -->
  <g font-size="12">
    <rect x="92" y="132" width="52" height="46" fill="#e5f0e6" stroke="#3fa34d" stroke-width="1.3"/>
    <text x="118" y="160" text-anchor="middle" fill="#2f7d3a">+6</text>
    <rect x="144" y="132" width="52" height="46" fill="#eef3f8" stroke="#1b6ca8" stroke-width="1.3"/>
    <text x="170" y="160" text-anchor="middle" fill="#1b6ca8">-3</text>
  </g>
  <text x="150" y="200" text-anchor="middle" font-size="10.5" font-style="italic" fill="#666">a block is mineable only if the blocks above it (its slope predecessors) are mined</text>
  <!-- precedence arcs (deep block -> the blocks above it) -->
  <path d="M118,132 L100,118" fill="none" stroke="#888" stroke-width="1" marker-end="url(#op)"/>
  <path d="M120,132 L128,118" fill="none" stroke="#888" stroke-width="1" marker-end="url(#op)"/>
  <path d="M132,132 L162,118" fill="none" stroke="#888" stroke-width="1" marker-end="url(#op)"/>
  <text x="20" y="96" font-size="11" fill="#666">up</text>
  <path d="M22,110 L22,72" fill="none" stroke="#666" stroke-width="1" marker-end="url(#op)"/>

  <!-- divider -->
  <line x1="300" y1="50" x2="300" y2="300" stroke="#ddd" stroke-width="1"/>

  <!-- RIGHT: the s-t network -->
  <!-- source -->
  <circle cx="360" cy="150" r="16" fill="#3fa34d" stroke="#1a1a2e" stroke-width="1.3"/>
  <text x="360" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">S</text>
  <!-- sink -->
  <circle cx="700" cy="150" r="16" fill="#c15a22" stroke="#1a1a2e" stroke-width="1.3"/>
  <text x="700" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">T</text>

  <!-- block nodes (positive near source side, negative near sink side) -->
  <g font-size="11">
    <circle cx="470" cy="80"  r="15" fill="#e5f0e6" stroke="#3fa34d" stroke-width="1.3"/><text x="470" y="84" text-anchor="middle" fill="#2f7d3a">+6</text>
    <circle cx="470" cy="130" r="15" fill="#e5f0e6" stroke="#3fa34d" stroke-width="1.3"/><text x="470" y="134" text-anchor="middle" fill="#2f7d3a">+3</text>
    <circle cx="470" cy="180" r="15" fill="#e5f0e6" stroke="#3fa34d" stroke-width="1.3"/><text x="470" y="184" text-anchor="middle" fill="#2f7d3a">+4</text>
    <circle cx="590" cy="105" r="15" fill="#eef3f8" stroke="#1b6ca8" stroke-width="1.3"/><text x="590" y="109" text-anchor="middle" fill="#1b6ca8">-1</text>
    <circle cx="590" cy="155" r="15" fill="#eef3f8" stroke="#1b6ca8" stroke-width="1.3"/><text x="590" y="159" text-anchor="middle" fill="#1b6ca8">-2</text>
    <circle cx="590" cy="205" r="15" fill="#eef3f8" stroke="#1b6ca8" stroke-width="1.3"/><text x="590" y="209" text-anchor="middle" fill="#1b6ca8">-3</text>
  </g>

  <!-- source -> positive blocks (cap v_b) -->
  <line x1="375" y1="145" x2="456" y2="86"  stroke="#3fa34d" stroke-width="1.3" marker-end="url(#oa)"/>
  <line x1="376" y1="150" x2="455" y2="130" stroke="#3fa34d" stroke-width="1.3" marker-end="url(#oa)"/>
  <line x1="375" y1="156" x2="456" y2="176" stroke="#3fa34d" stroke-width="1.3" marker-end="url(#oa)"/>
  <text x="405" y="112" font-size="9.5" fill="#2f7d3a">cap v_b</text>
  <!-- negative blocks -> sink (cap -v_b) -->
  <line x1="605" y1="108" x2="685" y2="143" stroke="#c15a22" stroke-width="1.3" marker-end="url(#oa)"/>
  <line x1="606" y1="155" x2="685" y2="150" stroke="#c15a22" stroke-width="1.3" marker-end="url(#oa)"/>
  <line x1="605" y1="202" x2="685" y2="157" stroke="#c15a22" stroke-width="1.3" marker-end="url(#oa)"/>
  <text x="648" y="188" font-size="9.5" fill="#c15a22">cap |v_b|</text>
  <!-- precedence arcs between blocks (INF) -->
  <line x1="484" y1="128" x2="576" y2="107" stroke="#1a1a2e" stroke-width="1.1" marker-end="url(#oa)"/>
  <line x1="484" y1="82"  x2="576" y2="152" stroke="#1a1a2e" stroke-width="1.1" marker-end="url(#oa)"/>
  <line x1="484" y1="182" x2="576" y2="200" stroke="#1a1a2e" stroke-width="1.1" marker-end="url(#oa)"/>
  <text x="524" y="128" font-size="9.5" fill="#1a1a2e">INF</text>

  <!-- min cut line -->
  <path d="M540 55 C520 120, 560 190, 536 250" fill="none" stroke="#b23a48" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="536" y="270" text-anchor="middle" font-size="10.5" fill="#b23a48">min cut</text>
  <text x="470" y="245" text-anchor="middle" font-size="10.5" fill="#2f7d3a">S-side = the pit</text>

  <!-- footer identity -->
  <text x="365" y="312" text-anchor="middle" font-size="11.5" fill="#1a1a2e">optimal pit = source side of the minimum cut;    pit value = (&#931; positive v_b) &#8722; maxflow    (Picard 1976).</text>
  <text x="365" y="330" text-anchor="middle" font-size="10.5" font-style="italic" fill="#555">The infinite-capacity precedence arcs force any feasible cut to respect the slope constraints exactly.</text>
</svg>
