[project]
name = "oreblocks"
version = "0.3.0"
description = "Synthetic 3D ore-body block models of the MineLib nature and their scheduling: seeded deposit archetypes, bench structure, slope precedence, UPIT economics, an exact max-closure solver, MineLib .blocks/.prec/.upit/.cpit/.pcpsp read/write, the certified CPIT LP bound by the critical multiplier algorithm, TopoSort rounding heuristics and spatial-coherence metrics"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Felipe Santibanez-Leal" }]
keywords = ["mining", "block-model", "ore-body", "ultimate-pit", "UPIT", "MineLib", "open-pit", "mine-planning", "max-closure", "synthetic-data", "production-scheduling", "CPIT", "PCPSP", "optimization", "Bienstock-Zuckerberg", "cutoff-grade", "stochastic"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.26"]

[project.urls]
Repository = "https://github.com/fsantibanezleal/CAOS_OreBlocks"
Changelog = "https://github.com/fsantibanezleal/CAOS_OreBlocks/blob/main/CHANGELOG.md"
Issues = "https://github.com/fsantibanezleal/CAOS_OreBlocks/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "scipy>=1.11"]
milp = ["scipy>=1.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 118
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
